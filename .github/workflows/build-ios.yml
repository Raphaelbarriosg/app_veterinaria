name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (Unsigned IPA)
    runs-on: macos-14
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build iOS Bundle (Release, No Codesign)
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://vetcare-backend-vxua.onrender.com/api/v1

      - name: Package Payload as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r vetcare-ios-unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetcare-ios-ipa
          path: mobile/vetcare-ios-unsigned.ipa
          retention-days: 14
