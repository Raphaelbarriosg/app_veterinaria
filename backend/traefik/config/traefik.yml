# ============================================
# Configuración de Traefik v3
# Reverse Proxy para Veterinaria Ecosistema
# ============================================

api:
  dashboard: true
  insecure: true  # Solo para desarrollo, en producción usar autenticación

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  
  websecure:
    address: ":443"

certificatesResolvers:
  myresolver:
    acme:
      email: ${TRAEFIK_ACME_EMAIL:-admin@veterinaria.com}
      storage: /letsencrypt/acme.json
      tlsChallenge: {}
      # Para producción, usar httpChallenge o dnsChallenge
      # httpChallenge:
      #   entryPoint: web
      # dnsChallenge:
      #   provider: cloudflare
      #   delayBeforeCheck: 0

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: veterinaria-network
  
  file:
    directory: /etc/traefik/config
    watch: true

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log
  bufferingSize: 100

metrics:
  prometheus:
    entryPoint: websecure

tracing: {}

